# bonus b-4 : docker compose up -d puis exporter DATABASE_URL (voir README)
services:
  db:
    image: postgres:16-alpine
    container_name: dungeon-postgres
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: dungeon
      POSTGRES_DB: dungeon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dungeon -d dungeon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
